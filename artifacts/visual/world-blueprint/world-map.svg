<!-- ASTRIX world map v1 — derived from ref3 hero (Image 3 PRIMARY).
     North up. Units meters. Hand-placed art-directed shapes (NOT noise output):
     these polygons are the design authority; terrain production traces them.
     Frame: main island ~480x340 centered near origin; world 800x600. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="-420 -320 840 640">
<defs>
  <radialGradient id="deep" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#1E9EC0"/><stop offset="100%" stop-color="#0A4A6E"/>
  </radialGradient>
</defs>
<rect x="-420" y="-320" width="840" height="640" fill="url(#deep)"/>
<!-- N arrow + scale -->
<g font-family="sans-serif" fill="#EAF4FF">
  <text x="-395" y="-290" font-size="26" font-weight="bold">N ↑</text>
  <text x="-395" y="295" font-size="16">0 ———— 100 ———— 200 m</text>
</g>
<!-- shallow shelf + reef gardens (S offshore) -->
<ellipse cx="30" cy="205" rx="150" ry="55" fill="#2FC4D8" opacity="0.35"/>
<g fill="#9B5DE5" opacity="0.8">
  <ellipse cx="-20" cy="210" rx="26" ry="12"/><ellipse cx="45" cy="220" rx="32" ry="14"/>
  <ellipse cx="110" cy="205" rx="22" ry="10"/>
</g>
<g fill="#3AA7C9" opacity="0.8">
  <ellipse cx="10" cy="200" rx="20" ry="9"/><ellipse cx="80" cy="215" rx="24" ry="11"/>
</g>
<!-- MAIN ISLAND mass: sand rim, grass interior, rock ridge N -->
<path id="coast" fill="#E8CF9A" d="M -210,60 L -190,-30 L -150,-110 L -90,-160 L -10,-178 L 80,-170 L 150,-130 L 195,-70 L 210,10 L 195,90 L 150,150 L 80,175 L 0,182 L -80,170 L -150,140 L -195,110 Z"/>
<path id="grass" fill="#5FBF5A" d="M -185,55 L -170,-25 L -135,-95 L -80,-140 L -5,-155 L 70,-148 L 130,-112 L 168,-60 L 182,8 L 170,80 L 130,130 L 70,152 L 0,158 L -70,148 L -130,122 L -168,95 Z"/>
<!-- northern highlands rock mass -->
<path id="ridge" fill="#9A9AA0" d="M -120,-80 L -70,-135 L 0,-155 L 70,-148 L 120,-108 L 90,-70 L 20,-60 L -60,-55 Z"/>
<path fill="#7A7A80" d="M -60,-95 L 0,-130 L 60,-120 L 40,-85 L -20,-80 Z"/>
<!-- farm belt soil plots (NE) -->
<g fill="#5B3418">
  <rect x="108" y="-60" width="48" height="26" rx="4" transform="rotate(-8 132 -47)"/>
  <rect x="108" y="-28" width="48" height="26" rx="4" transform="rotate(-8 132 -15)"/>
  <rect x="162" y="-58" width="42" height="26" rx="4" transform="rotate(-8 183 -45)"/>
  <rect x="162" y="-26" width="42" height="26" rx="4" transform="rotate(-8 183 -13)"/>
</g>
<!-- streams from ridge to civic lake -->
<g stroke="#7FD4E8" stroke-width="5" fill="none" opacity="0.9">
  <path d="M -30,-70 C -20,-40 -12,-20 -5,-2"/>
  <path d="M 45,-75 C 40,-45 30,-20 18,-2"/>
</g>
<!-- civic lake + plaza -->
<ellipse cx="8" cy="6" rx="26" ry="20" fill="#1E9EC0"/>
<circle cx="8" cy="6" r="10" fill="#E8CF9A"/>
<circle cx="8" cy="6" r="4" fill="#2E7FC9"/>
<!-- harbor bay SE: dock + lighthouse islet -->
<path d="M 150,150 L 195,90 L 215,110 L 175,165 Z" fill="#1E9EC0"/>
<g stroke="#8A5A33" stroke-width="7" fill="none">
  <path d="M 150,130 L 185,125 L 185,150"/>
</g>
<ellipse cx="228" cy="105" rx="26" ry="22" fill="#E8CF9A"/>
<ellipse cx="228" cy="103" rx="18" ry="15" fill="#5FBF5A"/>
<rect x="222" y="88" width="12" height="22" fill="#F4F1E8"/>
<rect x="222" y="84" width="12" height="6" fill="#C93030"/>
<g stroke="#8A5A33" stroke-width="5" fill="none"><path d="M 200,108 L 216,106"/></g>
<!-- outer islets -->
<ellipse cx="-195" cy="45" rx="30" ry="24" fill="#E8CF9A"/>
<ellipse cx="-195" cy="43" rx="22" ry="17" fill="#5FBF5A"/>
<path d="M -205,30 L -195,55 L -185,30 Z" fill="#9A9AA0"/>
