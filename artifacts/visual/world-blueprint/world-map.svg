  <g><circle cx="0" cy="165" r="15" fill="#FFB02E"/><text x="0" y="173" font-size="20" fill="#1a1200">12</text></g>
  <g><circle cx="-150" cy="120" r="15" fill="#FFB02E"/><text x="-150" y="128" font-size="20" fill="#1a1200">13</text></g>
