<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>ASTrix</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		#upload-widget {
			position: fixed;
			inset: 0;
			z-index: 9999;
			display: flex;
			align-items: center;
			justify-content: center;
			pointer-events: auto;
		}
		#upload-widget .backdrop {
			position: absolute;
			inset: 0;
			background: rgba(10, 14, 16, 0.72);
		}
		#upload-widget .panel {
			position: relative;
			width: min(460px, 90vw);
			background: #232c31;
			border: 1px solid #3b474e;
			border-radius: 18px;
			padding: 30px 24px;
			text-align: center;
			font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			color: #eef4f6;
			box-shadow: 0 20px 60px rgba(0,0,0,0.5);
		}
		#upload-widget .panel h2 { margin: 0 0 6px; font-size: 20px; }
		#upload-widget .panel .sub { color: #aab7bd; font-size: 13px; margin: 0 0 18px; }
		#upload-widget .drop {
			border: 2px dashed #6b7a81;
			border-radius: 12px;
			padding: 34px 16px;
			cursor: pointer;
			transition: border-color .15s, background .15s;
		}
		#upload-widget .drop.drag { border-color: #8fd3c7; background: rgba(143,211,199,0.08); }
		#upload-widget .drop .big { font-size: 36px; margin-bottom: 8px; }
		#upload-widget .drop .label { font-size: 15px; }
		#upload-widget .drop .hint { font-size: 12px; color: #8a979d; margin-top: 4px; }
		#upload-widget .status { min-height: 20px; margin-top: 14px; font-size: 14px; }
		#upload-widget .status.ok { color: #8fd3c7; }
		#upload-widget .status.err { color: #f0a090; }
		#upload-widget .close {
			position: absolute;
			top: 10px;
			right: 14px;
			background: none;
			border: none;
			color: #aab7bd;
			font-size: 22px;
			cursor: pointer;
			line-height: 1;
		}
		#upload-widget input[type=file] { display: none; }
		#upload-widget.mounted.done { display: none; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<div id="upload-widget" class="mounted">
			<div class="backdrop"></div>
			<div class="panel">
				<button class="close" id="uw-close" title="Hide" aria-label="Hide">&times;</button>
				<h2>🎥 Share a reference clip</h2>
				<p class="sub">Drop a video (&lt;15&nbsp;MB) that shows the ASTrix look you're after.</p>
				<div class="drop" id="uw-drop" role="button" tabindex="0">
					<div class="big">🎥</div>
					<div class="label">Drop the video here, or click to choose</div>
					<div class="hint">mp4 / webm / mov &middot; up to 15 MB</div>
				</div>
				<input type="file" id="uw-file" accept="video/*,.mp4,.webm,.mov,.m4v">
				<div class="status" id="uw-status"></div>
			</div>
		</div>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
// Upload widget — self-contained; independent of the Godot engine.
(function () {
	var w = document.getElementById('upload-widget');
	if (!w) return;
	var drop = document.getElementById('uw-drop');
	var file = document.getElementById('uw-file');
	var stat = document.getElementById('uw-status');
	function setStatus(text, ok) { stat.textContent = text; stat.className = 'status ' + (ok ? 'ok' : 'err'); }
	function hideDone() { w.classList.add('done'); }
	document.getElementById('uw-close').addEventListener('click', hideDone);
	drop.addEventListener('click', function () { file.click(); });
	drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
	['dragenter','dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('drag'); }); });
	['dragleave','drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('drag'); }); });
	function upload(f) {
		if (!f) return;
		if (f.size > 15 * 1024 * 1024) { setStatus('That file is over 15 MB.', false); return; }
		var form = new FormData();
		form.append('clip', f);
		setStatus('Uploading ' + f.name + '…', true);
		fetch('/api/upload-watch', { method: 'POST', body: form }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
			if (!x.ok || !x.j.ok) { setStatus('Upload failed: ' + (x.j.error || ''), false); return; }
			setStatus('Uploaded ✓ ' + f.name + ' — tell me the filename back in chat.', true);
			setTimeout(hideDone, 2500);
		}).catch(function (e) { setStatus('Upload error: ' + e.message, false); });
	}
	drop.addEventListener('drop', function (e) { upload(e.dataTransfer.files[0]); });
	file.addEventListener('change', function () { upload(file.files[0]); });
}());
</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":60140,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
