<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTrix</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1200px 700px at 50% 0%, #2d3a42, #14191d 70%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #eef4f6;
  }
  .card {
    width: min(480px, 92vw);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 28px;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: 0.02em; }
  p { color: #aab7bd; margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
  a { color: #8fd3c7; }
</style>
</head>
<body>
  <div class="card">
    <h1>⚡ ASTrix</h1>
    <p>Reference uploads are closed.</p>
    <p><a href="/">Play ASTrix</a></p>
  </div>
</body>
</html>
