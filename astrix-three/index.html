<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTrix Three.js Observatory — living island</title>
<style>
html,body{margin:0;height:100%;background:#06263f;color:#eaf4ff;font-family:system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%}#view{flex:1;position:relative}#c{width:100%;height:100%;display:block}
#hud{width:340px;background:#07233f;border-left:2px solid #1e5a8a;padding:12px 14px;overflow:auto;font-size:13px}
#hud h2{font-size:14px;margin:14px 0 6px;color:#ffb02e}#hud .row{display:flex;justify-content:space-between;padding:2px 0}
#hud .ok{color:#4ade80}#hud .warn{color:#ffb02e}#hud .bad{color:#ff7a7a}
#feed{font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;background:#06203a;border:1px solid #1e5a8a;border-radius:8px;padding:8px;max-height:220px;overflow:auto}
button{min-height:44px;min-width:44px;font-size:14px}
@media (max-width: 900px){#app{flex-direction:column}#view{flex:1;min-height:55%}#hud{width:auto;border-left:none;border-top:2px solid #1e5a8a;max-height:45%}}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.b-live{background:#0a5a2a}.b-replay{background:#5a4a0a}.b-decor{background:#334155}
#banner{position:absolute;top:10px;left:10px;background:rgba(4,25,45,.85);border:1px solid #1e5a8a;border-radius:10px;padding:8px 12px;font-size:13px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="app"><div id="view"><canvas id="c"></canvas><div id="banner">ASTRIX THREE.JS OBSERVATORY <span class="badge b-live" id="mode">LIVE?</span> <span class="badge b-decor">world=authority mirror</span></div></div>
<aside id="hud">
<h2>WORLD (authoritative mirror)</h2><div id="world"></div>
<h2>STEWARD</h2><div id="steward"></div>
<h2>GOVERNANCE <span id="gate"></span></h2><div id="gov"></div>
<h2>EVENTS</h2><div id="feed">connecting…</div>
<h2>MAGICBLOCK / SOLANA</h2><div id="chain"></div>
<h2>PERF</h2><div id="perf"></div>
</aside></div>
<script type="module" src="./main.js"></script>
</body></html>
